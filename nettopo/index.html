<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NetTopo — ネットワーク構成図エディタ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ===== 上部バー: タイトル・図面管理・入出力 ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🕸</span>
        <span class="brand-name">NetTopo</span>
        <span class="brand-sub">ネットワーク構成図エディタ（趣味プロジェクト）</span>
      </div>

      <div class="topbar-controls">
        <input id="diagram-name" class="diagram-name" type="text"
               placeholder="図面名" maxlength="60" title="図面名">
        <select id="diagram-select" title="保存済みの図面を切り替え"></select>
        <button id="btn-new" class="btn" title="新しい図面を作成">新規</button>
        <button id="btn-duplicate" class="btn" title="この図面を複製">複製</button>
        <button id="btn-delete-diagram" class="btn btn-danger" title="この図面を削除">図面削除</button>
        <span class="sep"></span>
        <button id="btn-export" class="btn" title="JSONとしてダウンロード">書き出し</button>
        <button id="btn-import" class="btn" title="JSONを読み込み">読み込み</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
        <span id="save-status" class="save-status" title="この端末のブラウザに自動保存されます">保存済み</span>
      </div>
    </header>

    <div class="main">

      <!-- ===== 左: 機器パレット ===== -->
      <aside class="palette">
        <h2>機器パレット</h2>
        <p class="hint">クリックでキャンバスに追加</p>
        <div id="palette-list" class="palette-list"></div>

        <h2>操作モード</h2>
        <div class="mode-buttons">
          <button id="mode-select" class="btn mode-btn is-active" data-mode="select"
                  title="ノードの移動・選択（V）">✥ 選択</button>
          <button id="mode-connect" class="btn mode-btn" data-mode="connect"
                  title="ノード2つを順にクリックして接続（C）">⤳ 接続</button>
          <button id="mode-delete" class="btn mode-btn" data-mode="delete"
                  title="クリックしたノード/線を削除（D）">✕ 削除</button>
        </div>

        <h2>表示</h2>
        <div class="view-controls">
          <label class="check"><input id="snap-grid" type="checkbox" checked> グリッド吸着</label>
          <div class="zoom-row">
            <button id="zoom-out" class="btn" title="縮小">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" class="btn" title="拡大">＋</button>
            <button id="zoom-reset" class="btn" title="表示リセット">全体</button>
          </div>
        </div>
      </aside>

      <!-- ===== 中央: キャンバス ===== -->
      <div class="canvas-wrap" id="canvas-wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line"/>
            </pattern>
          </defs>
          <rect id="grid-bg" fill="url(#grid)"/>
          <g id="layer-links"></g>
          <g id="layer-nodes"></g>
        </svg>
        <div id="canvas-hint" class="canvas-hint"></div>
      </div>

      <!-- ===== 右: プロパティパネル ===== -->
      <aside class="props" id="props">
        <h2>プロパティ</h2>
        <div id="props-empty" class="props-empty">
          ノードまたは接続線をクリックすると<br>ここで編集できます。
        </div>

        <!-- ノード編集 -->
        <div id="props-node" class="props-form" hidden>
          <label>名称
            <input id="prop-label" type="text" maxlength="60" placeholder="例: 本社コアSW">
          </label>
          <label>種別
            <select id="prop-type"></select>
          </label>
          <label>IPアドレス等
            <input id="prop-ip" type="text" maxlength="100" placeholder="例: 192.168.1.1/24">
          </label>
          <label>要件
            <textarea id="prop-req" rows="4" maxlength="2000"
                      placeholder="例: 冗長化必須、PoE給電、VLAN10/20収容…"></textarea>
          </label>
          <label>メモ
            <textarea id="prop-memo" rows="4" maxlength="2000"
                      placeholder="自由メモ（購入予定、設定手順のリンクなど）"></textarea>
          </label>
          <button id="prop-delete-node" class="btn btn-danger">このノードを削除</button>
        </div>

        <!-- 接続線編集 -->
        <div id="props-link" class="props-form" hidden>
          <div id="prop-link-ends" class="link-ends"></div>
          <label>ラベル
            <input id="prop-link-label" type="text" maxlength="60"
                   placeholder="例: 1Gbps / VLAN trunk">
          </label>
          <label>線種
            <select id="prop-link-style">
              <option value="solid">実線</option>
              <option value="dashed">破線（無線・論理など）</option>
            </select>
          </label>
          <button id="prop-delete-link" class="btn btn-danger">この接続を削除</button>
        </div>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status-mode"></span>
      <span id="status-count"></span>
      <span class="status-help">Del: 選択を削除 ／ Esc: 選択解除 ／ 背景ドラッグ: 移動 ／ ホイール: 拡大縮小</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
