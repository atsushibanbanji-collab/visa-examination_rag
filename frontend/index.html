<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ビザ検定</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <h1>ビザ検定</h1>
      <p class="subtitle">社内向け 知識確認テスト（AI出題）</p>
    </header>

    <section class="card">
      <h2>受験者情報</h2>
      <p class="muted">受験者名を入力してください。同じ名前で再受験すると単元別の連続記録がまとまります。</p>
      <label for="username">受験者名</label>
      <input type="text" id="username" placeholder="例：田中太郎" maxlength="50" autocomplete="off">
    </section>

    <section class="card">
      <h2>難易度を選択</h2>
      <p class="muted">難易度を選ぶと、単元の選択画面にそのまま進みます。出題はAIが原本に基づき毎回生成します。</p>
      <div class="level-grid" id="level-grid">
        <div class="loading">読み込み中…</div>
      </div>
    </section>

    <p class="note">※本検定は社内利用を想定しています。回答内容は管理者から閲覧可能です。</p>
  </div>

  <script>
    const usernameInput = document.getElementById("username");
    const levelGrid = document.getElementById("level-grid");

    const LEVEL_NAMES = { beginner: "初級", intermediate: "中級", advanced: "上級" };
    const LEVEL_ORDER = ["beginner", "intermediate", "advanced"];

    let levels = [];

    const savedName = localStorage.getItem("visa_quiz_username");
    if (savedName) usernameInput.value = savedName;

    function hasName() {
      return usernameInput.value.trim().length > 0;
    }

    // 受験者名の有無で、受験可能な難易度カードの活性（淡色）を切り替える。
    // 名前未入力のうちは淡色にして「先に名前を」と促す（押せば名前欄へフォーカス）。
    function updateCardState() {
      const ok = hasName();
      document.querySelectorAll(".level-card").forEach((el) => {
        const lv = levels.find((x) => x.id === el.dataset.id);
        if (!lv || !lv.available) return; // COMING SOON は常に淡色のまま
        el.classList.toggle("disabled", !ok);
      });
    }

    usernameInput.addEventListener("input", updateCardState);

    // 難易度カードを押したら、その場で単元選択画面へ直行する（中継ボタンは廃止）。
    function goToUnits(levelId) {
      const name = usernameInput.value.trim();
      if (!name) {
        usernameInput.focus();
        return;
      }
      localStorage.setItem("visa_quiz_username", name);
      const params = new URLSearchParams({ user: name, level: levelId });
      window.location.href = `/units.html?${params.toString()}`;
    }

    async function loadLevels() {
      try {
        // 観点メタのあるレベルから難易度を導出する（出題対象=ビザ種別単元のみ）
        const res = await fetch("/api/rag/cells");
        const data = await res.json();
        const counts = {};
        for (const cell of (data.cells || [])) {
          counts[cell.level] = (counts[cell.level] || 0) + 1;
        }
        levels = LEVEL_ORDER.map((id) => ({
          id,
          name: LEVEL_NAMES[id] || id,
          available: (counts[id] || 0) > 0,
          unit_count: counts[id] || 0,
        }));
        renderLevels();
      } catch (e) {
        levelGrid.innerHTML = '<div class="empty">難易度情報の取得に失敗しました</div>';
      }
    }

    function renderLevels() {
      levelGrid.innerHTML = "";
      for (const lv of levels) {
        const div = document.createElement("div");
        div.className = "level-card" + (lv.available ? "" : " disabled");
        div.dataset.id = lv.id;

        const meta = lv.available
          ? `<div class="meta">${lv.unit_count}単元</div>`
          : `<div class="coming-soon">COMING SOON</div>`;
        div.innerHTML = `<h3>${lv.name}</h3>${meta}`;

        if (lv.available) {
          div.addEventListener("click", () => goToUnits(lv.id));
        }
        levelGrid.appendChild(div);
      }
      updateCardState(); // 初期反映（保存名があれば明るく・押せる状態に）
    }

    loadLevels();
  </script>
</body>
</html>
