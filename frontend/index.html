<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ビザ検定</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <h1>ビザ検定</h1>
      <p class="subtitle">社内向け 知識確認テスト（AI出題）</p>
    </header>

    <section class="card">
      <h2>受験者情報</h2>
      <p class="muted">受験者名を入力してください。同じ名前で再受験すると単元別の連続記録がまとまります。</p>
      <label for="username">受験者名</label>
      <input type="text" id="username" placeholder="例：田中太郎" maxlength="50" autocomplete="off">
    </section>

    <section class="card">
      <h2>難易度を選択</h2>
      <p class="muted">レベルを選んだ後、単元別に受験できます。出題はAIが原本に基づき毎回生成します。</p>
      <div class="level-grid" id="level-grid">
        <div class="loading">読み込み中…</div>
      </div>
    </section>

    <div class="btn-row">
      <button class="btn" id="start-btn" disabled>単元を選ぶ</button>
    </div>
    <p class="note">※本検定は社内利用を想定しています。回答内容は管理者から閲覧可能です。</p>
  </div>

  <script>
    const usernameInput = document.getElementById("username");
    const levelGrid = document.getElementById("level-grid");
    const startBtn = document.getElementById("start-btn");

    const LEVEL_NAMES = { beginner: "初級", intermediate: "中級", advanced: "上級" };
    const LEVEL_ORDER = ["beginner", "intermediate", "advanced"];

    let selectedLevel = null;
    let levels = [];

    const savedName = localStorage.getItem("visa_quiz_username");
    if (savedName) usernameInput.value = savedName;

    function refreshStart() {
      const hasName = usernameInput.value.trim().length > 0;
      startBtn.disabled = !(hasName && selectedLevel);
    }

    usernameInput.addEventListener("input", refreshStart);

    async function loadLevels() {
      try {
        // 観点メタのあるレベルから難易度を導出する
        const res = await fetch("/api/rag/cells");
        const data = await res.json();
        const counts = {};
        for (const c of (data.cells || [])) {
          counts[c.level] = (counts[c.level] || 0) + 1;
        }
        levels = LEVEL_ORDER.map((id) => ({
          id,
          name: LEVEL_NAMES[id] || id,
          available: (counts[id] || 0) > 0,
          unit_count: counts[id] || 0,
        }));
        renderLevels();
      } catch (e) {
        levelGrid.innerHTML = '<div class="empty">難易度情報の取得に失敗しました</div>';
      }
    }

    function renderLevels() {
      levelGrid.innerHTML = "";
      for (const lv of levels) {
        const div = document.createElement("div");
        div.className = "level-card" + (lv.available ? "" : " disabled");
        div.dataset.id = lv.id;

        const meta = lv.available
          ? `<div class="meta">${lv.unit_count}単元</div>`
          : `<div class="coming-soon">COMING SOON</div>`;
        div.innerHTML = `<h3>${lv.name}</h3>${meta}`;

        if (lv.available) {
          div.addEventListener("click", () => {
            selectedLevel = lv.id;
            document.querySelectorAll(".level-card").forEach(el => el.classList.remove("selected"));
            div.classList.add("selected");
            refreshStart();
          });
        }
        levelGrid.appendChild(div);
      }
    }

    startBtn.addEventListener("click", () => {
      const name = usernameInput.value.trim();
      if (!name || !selectedLevel) return;
      localStorage.setItem("visa_quiz_username", name);
      const params = new URLSearchParams({ user: name, level: selectedLevel });
      window.location.href = `/units.html?${params.toString()}`;
    });

    loadLevels();
  </script>
</body>
</html>
