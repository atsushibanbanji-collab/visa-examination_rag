<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ビザ検定 - 受験中</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="app-shell app-shell--quiz">
    <header class="header">
      <h1>ビザ検定</h1>
      <p class="subtitle" id="user-label"></p>
    </header>

    <div id="loading" class="loading">問題を準備中…</div>

    <main id="quiz-area" style="display:none;">
      <div class="quiz-topbar">
        <button class="btn btn-abort" id="abort-btn" type="button">検定を中止する</button>
      </div>

      <div class="quiz-header">
        <div class="quiz-mode-label" id="quiz-mode-label"></div>
        <div class="quiz-unit-name" id="quiz-unit-name"></div>
      </div>

      <div class="progress-meta">
        <span class="step" id="step-label">1 / 10</span>
        <span class="category" id="category-label"></span>
      </div>
      <div class="progress"><div class="bar" id="progress-bar" style="width:10%"></div></div>

      <section class="card">
        <p class="question-text" id="question-text"></p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" style="display:none;">
          <div class="feedback-head">
            <span class="feedback-mark" id="feedback-mark"></span>
            <span id="feedback-label"></span>
          </div>
          <div class="feedback-explanation">
            <span class="label">解説</span>
            <span class="body" id="feedback-explanation-text"></span>
          </div>
          <div class="feedback-actions">
            <button type="button" class="btn btn-secondary btn-challenge" id="challenge-btn">この問題に異議を申し立てる</button>
            <span class="challenge-done" id="challenge-done" hidden>✓ 異議を申し立て済み</span>
          </div>
        </div>
      </section>

      <div class="btn-row">
        <button class="btn btn-secondary" id="prev-btn" disabled>← 戻る</button>
        <button class="btn" id="next-btn" disabled>次へ →</button>
        <button class="btn" id="submit-btn" disabled style="display:none;">採点する</button>
      </div>
    </main>

    <div id="error-area" class="card" style="display:none;">
      <h2>エラー</h2>
      <p id="error-message"></p>
      <div class="btn-row">
        <a class="btn btn-secondary" id="error-back" href="/">トップに戻る</a>
      </div>
    </div>
  </div>

  <!-- 異議申し立て（チャレンジ）モーダル -->
  <div class="modal-overlay" id="challenge-modal" hidden>
    <div class="modal-card">
      <h2>異議を申し立てる</h2>
      <p class="muted">この設問の採点結果や出題内容に誤りがあると思われる場合、内容を記入して送信してください。管理者が確認し、認められた場合は正解として訂正されます。</p>
      <label>種別</label>
      <div class="challenge-kind">
        <label><input type="radio" name="challenge-kind" value="grading" checked> 採点（正誤判定）がおかしい</label>
        <label><input type="radio" name="challenge-kind" value="content"> 出題内容が事実と違う</label>
      </div>
      <label for="challenge-reason" style="margin-top:10px; display:block;">理由</label>
      <textarea id="challenge-reason" rows="4" maxlength="1000" placeholder="例：解説の根拠が原本の記載と異なる など"></textarea>
      <p class="muted" id="challenge-error" style="color: var(--danger);" hidden></p>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="challenge-cancel">キャンセル</button>
        <button type="button" class="btn" id="challenge-submit">送信する</button>
      </div>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/quiz.js"></script>
</body>
</html>
