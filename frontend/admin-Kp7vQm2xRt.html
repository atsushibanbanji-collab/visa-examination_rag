<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ビザ検定 - 管理画面</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="app-shell app-shell--wide">
    <header class="header">
      <h1>ビザ検定 - 管理画面</h1>
      <p class="subtitle">受験状況の確認</p>
    </header>

    <div id="loading" class="loading">読み込み中…</div>

    <main id="content" style="display:none;">
      <section class="card">
        <h2>受験者一覧</h2>
        <p class="muted">クリア済み単元の多い順。受験者名をクリックすると、その受験者の履歴を表示します。</p>
        <div id="users-area"></div>
      </section>

      <section class="card" id="history-card" style="display:none;">
        <h2 id="history-title">受験履歴</h2>
        <div id="history-area"></div>
      </section>

      <p class="note">※本画面はURL難読化のみで保護されています。本番運用時はBasic認証やIP制限等の追加保護を検討してください。</p>
    </main>

    <div id="error-area" class="card" style="display:none;">
      <h2>読み込みエラー</h2>
      <p id="error-message"></p>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
